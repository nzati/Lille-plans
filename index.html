<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plans de Lille</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="icon-btn hidden" type="button" aria-label="Retour">←</button>
    <h1 id="app-title">Plans de Lille</h1>
  </header>

  <main id="view-home" class="view">
    <div id="card-list" class="card-list"></div>
  </main>

  <main id="view-detail" class="view hidden">
    <div class="detail-toolbar">
      <button id="btn-png" class="btn btn-primary" type="button">Télécharger en PNG</button>
      <button id="btn-svg" class="btn btn-secondary" type="button">Télécharger en SVG</button>
    </div>
    <div id="map-container" class="map-container"></div>
  </main>

  <button id="settings-fab" class="fab" type="button" aria-label="Réglages (thème clair/sombre)">⚙</button>

  <footer class="foot-note">
    Plans schématiques non contractuels, réalisés à partir des données du réseau Ilévia. Inspirés du style visuel des plans de transport parisiens.
  </footer>

  <script src="app.js"></script>
</body>
</html>
