name: Generate release keystore (one-time)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Lille Plans, OU=Lille Plans, O=Lille Plans, L=Lille, ST=Hauts-de-France, C=FR"
          base64 -w0 release.keystore > release.keystore.b64

      - name: Upload keystore (raw, for safekeeping)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 1

      - name: Upload keystore (base64, for secret storage)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-base64
          path: release.keystore.b64
          retention-days: 1
